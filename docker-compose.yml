services:
  app:
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./static
        target: /opt/app/static
    restart: always
    networks:
      - node-network
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    depends_on:
      - postgres


  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    container_name: node-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - node-network
    restart: always


volumes:
  pg-data:

networks:
  node-network:
    driver: bridge
